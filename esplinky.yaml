substitutions:
  devicename: esplinky
  api_key: !secret api_key_esplinky
  ota_password: !secret ota_password_esplinky

packages:
  auth: !include inc/auth.yaml

esphome:
  name: $devicename

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

# logger:
#   level: DEBUG
#   hardware_uart: USB_SERIAL_JTAG

network:
  enable_ipv6: true

openthread:
  tlv: 0e080000000000010000000300000f4a0300000f35060004001fffe00208a9ce48f7c9643e1b0708fd2087ff4b9aa2080510e0020c62fe11fcd69cdcea5947f0a35d030e68612d7468726561642d373830620102780b041069c8c1358dc2ffffda3b49ccc66a35a00c0402a0f7f8

uart:
  baud_rate: 9600
  rx_pin: GPIO13
  parity: EVEN
  data_bits: 7
  stop_bits: 1

teleinfo:
  historical_mode: false
  update_interval: 30s

sensor:
  - platform: teleinfo
    tag_name: EASF01
    name: Energie active HC
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    tag_name: EASF02
    name: Energie active HP
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing

  - platform: teleinfo
    tag_name: IRMS1
    name: Courant efficace
    unit_of_measurement: A
    device_class: current

  - platform: teleinfo
    tag_name: SINSTS
    name: Puissance apparente
    unit_of_measurement: VA
    device_class: apparent_power
    on_value:
      - sensor.template.publish:
          id: power_ratio
          state: !lambda return x / id(ref_power).state;

  - platform: teleinfo
    tag_name: UMOY1
    name: Tension moyenne
    unit_of_measurement: V
    device_class: voltage

  - platform: teleinfo
    tag_name: PREF
    id: ref_power
    unit_of_measurement: VA
    device_class: apparent_power
    filters:
      - multiply: 1000.0

  - platform: template
    name: Puissance apparente vs. abonnement
    id: power_ratio
    update_interval: never
    unit_of_measurement: "%"
    filters:
      - multiply: 100.0
    on_raw_value:
      then:
        - if:
            condition:
              lambda: return isnan(x);
            then:
              - light.turn_off:
                  id: rgb_led
            else:
              - light.turn_on:
                  id: rgb_led
                  brightness: 0.5
                  red: !lambda return min(2.0 * x, 1.0);
                  green: !lambda return min(2.0 * (1.0 - min(x, 1.0f)), 1.0);
                  blue: 0.0

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    id: rgb_led
