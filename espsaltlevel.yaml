substitutions:
  devicename: espsaltlevel
  api_key: !secret api_key_espsaltlevel
  ota_password: !secret ota_password_espsaltlevel

packages:
  wifi: !include inc/wifi.yaml
  auth: !include inc/auth.yaml

esphome:
  name: $devicename
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

logger:

deep_sleep:
  id: deep_sleep_1

i2c:

binary_sensor:
  - platform: homeassistant
    id: sleep_inhibited_${devicename}
    entity_id: input_boolean.inhibit_${devicename}_sleep

sensor:
  - platform: adc
    name: Tension batterie ${devicename}
    id: battery_voltage_${devicename}
    pin: GPIO3
    attenuation: 12db
    icon: mdi:battery
    device_class: voltage
    unit_of_measurement: V
    filters:
      - multiply: 2.0
    on_value:
      then:
        - script.execute: check_all_published
  - platform: vl53l0x
    name: Hauteur sel adoucisseur
    id: salt_level_${devicename}
    device_class: distance
    on_value:
      then:
        - script.execute: check_all_published

script:
  - id: check_all_published
    mode: restart
    then:
      - if:
          condition:
            - api.connected:
            - binary_sensor.is_off: sleep_inhibited_${devicename}
          then:
            - lambda: |-
                static bool battery_voltage_published = false;
                static bool salt_level_published = false;

                if (!battery_voltage_published && id(battery_voltage_${devicename}).has_state()) {
                  battery_voltage_published = true;
                }
                if (!salt_level_published && id(salt_level_${devicename}).has_state()) {
                  salt_level_published = true;
                }

                if (battery_voltage_published && salt_level_published) {
                  id(deep_sleep_1).set_run_duration(2 * 1000);
                  id(deep_sleep_1).set_sleep_duration(15 * 60 * 1000);
                  id(deep_sleep_1).begin_sleep();
                }
